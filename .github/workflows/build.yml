name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.0.0 (пусто — только сборка)'
        required: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            export VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash build.sh

      - name: Smoke test
        run: |
          RES="build/Torrent Disk.app/Contents/Resources"
          DATA="$HOME/Library/Application Support/TorrentDisk"
          report() {
            echo "::error title=$1::$(tail -n 20 "$DATA/logs/stdout.log" 2>/dev/null | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
          # Маленький .torrent для проверки: пиров нет, но список файлов берётся из самого файла.
          mkdir -p "$DATA/torrents"
          python3 - "$DATA/torrents/test.torrent" <<'PY'
          import hashlib, os, sys
          data = os.urandom(300000)
          plen = 262144
          pieces = b"".join(hashlib.sha1(data[i:i+plen]).digest() for i in range(0, len(data), plen))
          def be(x):
              if isinstance(x, int): return b"i%de" % x
              if isinstance(x, str): x = x.encode()
              if isinstance(x, bytes): return b"%d:%s" % (len(x), x)
              if isinstance(x, list): return b"l" + b"".join(map(be, x)) + b"e"
              return b"d" + b"".join(be(k) + be(x[k]) for k in sorted(x)) + b"e"
          info = {"name": "Library", "piece length": plen, "pieces": pieces,
                  "files": [{"length": len(data), "path": ["books", "book.fb2"]}]}
          open(sys.argv[1], "wb").write(be({"info": info}))
          PY
          "$RES/tdisk.sh" start || report "start failed"
          PASS=$(cat "$DATA/.password")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PROPFIND -H "Depth: 1" -u "admin:$PASS" http://127.0.0.1:36911/)
          [ "$code" = 207 ] || report "webdav returned $code"
          curl -s -X PROPFIND -H "Depth: 1" -u "admin:$PASS" http://127.0.0.1:36911/torrents/ | grep -q Library \
            || report "torrent not listed in webdav"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4444/api/status)
          [ "$code" = 200 ] || report "http api returned $code"
          "$RES/tdisk.sh" stop

      - uses: actions/upload-artifact@v4
        with:
          name: TorrentDisk-dmg
          path: build/TorrentDisk.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name || github.ref_name }}
          name: Torrent Disk ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/TorrentDisk.dmg
