name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash build.sh

      - name: Smoke test
        run: |
          RES="build/Torrent Disk.app/Contents/Resources"
          "$RES/tdisk.sh" start
          curl -fsS -o /dev/null -u "admin:$(cat "$HOME/Library/Application Support/TorrentDisk/.password")" http://127.0.0.1:36911/
          curl -fsS http://127.0.0.1:4444/api/status
          "$RES/tdisk.sh" stop

      - uses: actions/upload-artifact@v4
        with:
          name: TorrentDisk-dmg
          path: build/TorrentDisk.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TorrentDisk.dmg
