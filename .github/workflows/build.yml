name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.0.0 (пусто — только сборка)'
        required: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Engine tests
        working-directory: engine
        run: |
          if ! out=$(CGO_ENABLED=0 go test -count=1 -v ./... 2>&1); then
            echo "$out" | grep -E "FAIL|_test.go" | head -20 | while IFS= read -r line; do echo "::error title=go test::$line"; done
            exit 1
          fi
          echo "::notice title=go test::$(echo "$out" | grep -E "after reading|^ok" | tr '\n' '|')"

      - name: Build app and DMG
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            export VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash build.sh

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:" build/swiftc.log | head -20 | while IFS= read -r line; do
            echo "::error title=swiftc::$line"
          done

      - name: Smoke test
        run: |
          BIN="build/Torrent Disk.app/Contents/MacOS/TorrentDisk"
          # Маленький .torrent для проверки: пиров нет, но список файлов берётся из самого файла.
          python3 - "$RUNNER_TEMP/test.torrent" <<'PY'
          import hashlib, os, sys
          data = os.urandom(300000)
          plen = 262144
          pieces = b"".join(hashlib.sha1(data[i:i+plen]).digest() for i in range(0, len(data), plen))
          def be(x):
              if isinstance(x, int): return b"i%de" % x
              if isinstance(x, str): x = x.encode()
              if isinstance(x, bytes): return b"%d:%s" % (len(x), x)
              if isinstance(x, list): return b"l" + b"".join(map(be, x)) + b"e"
              return b"d" + b"".join(be(k) + be(x[k]) for k in sorted(x)) + b"e"
          info = {"name": "Библиотека", "piece length": plen, "pieces": pieces,
                  "files": [{"length": len(data), "path": ["books", "book.fb2"]}]}
          open(sys.argv[1], "wb").write(be({"info": info}))
          PY
          if out=$("$BIN" --selftest "$RUNNER_TEMP/test.torrent" 2>&1); then
            echo "::notice title=selftest::$(echo "$out" | tr '\n' '|')"
          else
            echo "::error title=selftest::$(echo "$out" | tr '\n' '|' | cut -c1-3000)"
            exit 1
          fi
          # Подключение диска на CI-машине может быть недоступно — результат только для информации.
          out=$("$BIN" --selftest "$RUNNER_TEMP/test.torrent" --mount 2>&1) || true
          echo "::notice title=mount test::$(echo "$out" | tr '\n' '|' | cut -c1-3000)"

      - name: Screenshot
        if: github.event_name == 'workflow_dispatch'
        run: |
          DATA="$HOME/Library/Application Support/TorrentDisk"
          python3 - "$DATA" <<'PY'
          import json, os, sys, datetime
          lib = os.path.join(sys.argv[1], "library")
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          items = []
          for i, f in enumerate(sorted(os.listdir(lib))):
              items.append({"id": f[:-8], "name": "Библиотека", "size": 300000, "isFolder": True,
                            "addedAt": now.isoformat().replace("+00:00", "Z"),
                            "lastUsedAt": (now - datetime.timedelta(hours=3)).isoformat().replace("+00:00", "Z")})
          json.dump(items, open(os.path.join(sys.argv[1], "history.json"), "w"))
          PY
          open "build/Torrent Disk.app"
          sleep 12
          mkdir -p shots
          screencapture -x shots/main.png
          osascript -e 'tell application "Torrent Disk" to quit' || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cd shots
          git init -q -b screenshots
          git add main.png
          git commit -qm "Screenshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: TorrentDisk-dmg
          path: build/TorrentDisk.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name || github.ref_name }}
          name: Torrent Disk ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: build/TorrentDisk.dmg
